name: Deploy WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.26.0"

      - name: Lint
        run: |
          GOOS=js GOARCH=wasm go vet ./...
          go fmt ./... && git diff --exit-code

      - name: Build optimised WASM binary
        run: GOOS=js GOARCH=wasm go build -ldflags="-s -w" -trimpath -o godaleks.wasm ./main.go

      - name: Copy wasm_exec.js from Go installation
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm_exec.js

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp wasm_exec.js _site/
          cp godaleks.wasm _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
