name: Deploy WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.26.0"

      - name: Lint
        run: |
          GOOS=js GOARCH=wasm go vet ./...
          go fmt ./... && git diff --exit-code

      - name: Install system dependencies for native test compilation
        # cmd/ tests import the cmd package which transitively pulls in
        # Ebiten's CGO (GLFW/X11/ALSA). The WASM build itself doesn't need
        # these, but go test ./... must compile the package natively.
        # xvfb provides a virtual X display for Ebiten's GLFW init() which
        # runs at package-load time even when RunGame isn't invoked.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libgl-dev libxxf86vm-dev xvfb

      - name: Run tests
        run: xvfb-run -a go test ./...

      - name: Build release WASM binary
        # Release flags:
        #   -ldflags="-s -w" strips the symbol table and DWARF debug info
        #   -trimpath        removes local filesystem paths (reproducible)
        #   -buildvcs=false  omits embedded VCS stamps (deterministic)
        run: GOOS=js GOARCH=wasm go build -ldflags="-s -w" -trimpath -buildvcs=false -o godaleks.wasm ./main.go

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Optimise WASM binary size
        # wasm-opt -O4 typically reduces Go WASM binary size by 15-25%
        # --strip-debug / --strip-producers remove any remaining metadata.
        run: |
          wasm-opt --version
          ls -l godaleks.wasm
          wasm-opt -O4 --strip-debug --strip-producers godaleks.wasm -o godaleks.wasm
          ls -l godaleks.wasm

      - name: Copy wasm_exec.js from Go installation
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm_exec.js

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp wasm_exec.js _site/
          cp godaleks.wasm _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
