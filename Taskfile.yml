# using - https://taskfile.dev/

version: "3"

#ENV VARS
env:
  TARGET: godaleks.exe #Change this to suit
  APPPATH: ./main.go #Change this to suit
  VERSION: 1.2.2 #Change this to suit
  PROJECT_NAME: godaleks #Change this to suit

###########################################################################

tasks:
  ## release - Builds the project in preparation for (local)release
  release:
    deps: [lint]
    cmds:
      - go build -ldflags="-s -w" -o bin/{{.TARGET}} {{.APPPATH}}

  ###############################################################################

  ## goreleaser - Builds the project in preparation for release
  goreleaser:
    cmds:
      - goreleaser release --snapshot --clean

  ###############################################################################

  ## build - Builds the project in preparation for debug
  build:
    cmds:
      - go build -o bin/$TARGET $APPPATH

  ###############################################################################

  ## run - builds and runs the program on the target platform
  run:
    cmds:
      - go run $APPPATH

  ###############################################################################

  ## clean - Remove the old builds and any debug information
  clean:
    cmds:
      - go clean -cache
      - go clean
      - rm -rf dist bin
    platforms: [darwin, linux]
  clean_windows:
    silent: true
    cmds:
      - cmd /c "rmdir /s /q dist || exit 0"
      - cmd /c "rmdir /s /q bin || exit 0"
    platforms: [windows]

  ###############################################################################

  ## test - executes unit tests
  test:
    cmds:
      - go test -v ./...

  ###############################################################################

  ## deps - fetches any external dependencies and updates
  deps:
    cmds:
      - go mod tidy
      - go mod download
      - go get -u ./...

  ###############################################################################

  ## vet - Vet examines Go source code and reports suspicious constructs
  vet:
    cmds:
      - go vet ./...

  ###############################################################################

  ## staticcheck - Runs static code analyzer staticcheck
  staticcheck:
    cmds:
      - go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  ###############################################################################

  ## seccheck - Code vulnerability check
  seccheck:
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ###############################################################################

  ## lint - format code and tidy modules
  lint:
    cmds:
      - go fmt ./...
      - go mod tidy -v
      - go fix ./...
      #- golangci-lint run ./...

  ###############################################################################

  ## generate - update build version
  generate:
    cmds:
      - go generate $APPPATH

  ###############################################################################

  ## wasm:build - build the WebAssembly bundle into ./web for local testing.
  ## Matches the release flags used by .github/workflows/deploy-wasm.yml:
  ##   -ldflags "-s -w" strip symbol table / DWARF debug info
  ##   -trimpath        remove local filesystem paths (reproducible)
  ##   -buildvcs=false  omit embedded VCS stamps (deterministic)
  ## The CI pipeline additionally runs wasm-opt -O4 post-build for extra
  ## size reduction; that step requires binaryen and is skipped locally.
  ## See https://ebitengine.org/en/documents/webassembly.html
  wasm:build:
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - mkdir -p web
      - go build -trimpath -ldflags="-s -w" -buildvcs=false -o web/godaleks.wasm ./main.go
      - cp "{{.TASKFILE_DIR}}/wasm_exec.js" web/wasm_exec.js
      - cp "{{.TASKFILE_DIR}}/index.html" web/index.html

  ## wasm:serve - serve the ./web directory on http://127.0.0.1:8080
  wasm:serve:
    cmds:
      - go run ./scripts/serve -dir web -addr 127.0.0.1:8080

  ## wasm - build the WASM bundle and serve it locally on http://127.0.0.1:8080
  wasm:
    deps: [wasm:build]
    cmds:
      - task: wasm:serve
